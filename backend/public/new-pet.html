
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create New Pet</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 500px;
            margin: 50px auto;
            padding: 20px;
            background: #f4f4f4;
        }

        form {
            background: white;
            padding: 24px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
        }

        label {
            display: block;
            margin-top: 16px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input, select, button {
            width: 100%;
            box-sizing: border-box;
            padding: 10px;
            font-size: 16px;
        }

        button {
            margin-top: 24px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        button:disabled {
            background: #999;
            cursor: not-allowed;
        }

        #message {
            margin-top: 16px;
        }

        .success {
            color: green;
        }

        .error {
            color: red;
        }
    </style>
</head>
<body>
    <h1>Create a New Pet</h1>

    <form id="pet-form">
        <label for="name">Pet Name</label>
        <input
            type="text"
            id="name"
            name="name"
            required
        >

        <label for="species">Species</label>
        <input
            type="text"
            id="species"
            name="species"
            placeholder="e.g. Dog, Cat, Rabbit"
            required
        >

        <label for="adopted">Adopted</label>
        <select id="adopted" name="adopted" required>
            <option value="false" selected>No</option>
            <option value="true">Yes</option>
        </select>

        <button type="submit" id="submit-button">
            Create Pet
        </button>

        <p id="message" role="status" aria-live="polite"></p>
    </form>

    <script>
        const form = document.getElementById('pet-form');
        const message = document.getElementById('message');
        const submitButton = document.getElementById('submit-button');

        form.addEventListener('submit', async (event) => {
            event.preventDefault();

            const pet = {
                name: document.getElementById('name').value.trim(),
                species: document.getElementById('species').value.trim(),
                adopted: document.getElementById('adopted').value === 'true'
            };

            message.textContent = '';
            message.className = '';
            submitButton.disabled = true;

            try {
                const response = await fetch('/pets', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(pet)
                });

                if (!response.ok) {
                    throw new Error(`Request failed: ${response.status}`);
                }

                const createdPet = await response.json();

                message.textContent =
                    `Pet "${createdPet.name}" created successfully!`;
                message.className = 'success';

                form.reset();
            } catch (error) {
                console.error('Error creating pet:', error);

                message.textContent =
                    'Failed to create pet. Please try again.';
                message.className = 'error';
            } finally {
                submitButton.disabled = false;
            }
        });
    </script>
</body>
</html>
